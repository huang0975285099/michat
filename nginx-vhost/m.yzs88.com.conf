# m.yzs88.com - E2EE Chat TLS edge proxy

# These directives are valid in nginx's http context because conf.d is included
# directly from the image's top-level http block.
limit_req_zone  $binary_remote_addr zone=api_req:10m rate=100r/s;
limit_req_zone  $binary_remote_addr zone=ws_req:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name m.yzs88.com;
    return 301 https://m.yzs88.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.yzs88.com;

    ssl_certificate     /etc/nginx/ssl/m.yzs88.com.pem;
    ssl_certificate_key /etc/nginx/ssl/m.yzs88.com.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  2m;
    limit_conn perip_conn 500;

    location / {
        set $frontend frontend:80;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $frontend frontend:80;
        access_log off;
        limit_req zone=api_req burst=200 nodelay;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $frontend frontend:80;
        access_log off;
        limit_req zone=ws_req burst=60 nodelay;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
