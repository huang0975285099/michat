<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SLG UI Test</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1a2419;overflow:hidden;}</style>
</head>
<body>
<div id="game" style="width:100vw;height:100vh;"></div>
<script type="module">
import { createSlgGame } from '/src/games/slg/game/SlgGame.js'
import { GameState } from '/src/games/slg/game/core/GameState.js'

const state = new GameState(12345)

// 伪造武将，模拟截图中的等级/属性分布
function fakeGeneral(id, name, lv, quality, troopType, atk, def, int, spd, troops, cap, exp, expMax, stamina, skillId, equipCount) {
  const g = {
    id, name, quality, troopType, faction: null,
    atk, def, spd, int, lv, exp, troops, state: 'idle',
    stamina, awaken: 0, skillId,
    equip: { weapon: null, helmet: null, necklace: null, armor: null, belt: null, boots: null },
  }
  for (let i = 0; i < equipCount; i++) {
    const types = ['weapon','helmet','necklace','armor','belt','boots']
    g.equip[types[i]] = 'x'
  }
  g._cap = cap
  return g
}

state.generals.push(
  fakeGeneral('zhanghe', '张郃', 10, 'elite', 'archer', 124, 122, 98, 98, 1364, 2000, 893, 2000, 29, 'huogong', 1),
  fakeGeneral('zhangfei', '张飞', 6, 'elite', 'shield', 117, 97, 59, 65, 897, 1200, 934, 1200, 61, 'jiaoxie', 0),
  fakeGeneral('caocao', '曹操', 4, 'rare', 'cavalry', 88, 70, 60, 55, 300, 900, 100, 900, 80, null, 0),
)
// troopCap 由 state.troopCap(g) 计算，忽略我们塞的 _cap，属正常

window.__slgState = state

window.createSlgGame = createSlgGame
const game = createSlgGame(document.getElementById('game'), state)
window.__slgGame = game

// 装备仓库伪造数据，对应截图：普通项链-武 +6, 普通腰带-防 +5, 精良靴子-速 +10
state.equipments.push(
  { iid: 'eq_1', type: 'necklace', quality: 'common', attr: 'atk', level: 2, boundTo: null },
  { iid: 'eq_2', type: 'belt', quality: 'common', attr: 'def', level: 1, boundTo: null },
  { iid: 'eq_3', type: 'boots', quality: 'rare', attr: 'spd', level: 1, boundTo: null },
)

window.__openGenerals = () => game.scene.getScene('UI')._openGenerals()
window.__openEquip = () => game.scene.getScene('UI')._openEquipWarehouse()
</script>
</body>
</html>
