server {
    listen 80;
    server_name m.yzs88.com;

    root  /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-1khQVHSpZN6ao7Mz5oQVOZp0DUbhfeh7gaACHa6hdtI=' 'sha256-t76ABT/rfuBYSFBlHZMfVt0fxrnGmo/wZr34YP0K0pE=' 'sha256-UBkYgPgiZBFG3L+ndNb3scO3EC/n1cO/CDvqsOiwHhI=' 'sha256-KKUq0K4BT5+WxogHlftH3nLleklV6aEEfxJ1UJ9xbww=' 'sha256-5z2p7XnhuW/GZAI9pkti4w/4gXI0uUWxIe8RBgHQjWE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://m.yzs88.com:8088 wss://m.yzs88.com:8088 wss://m.yzs88.com blob:" always;

    # Defense in depth: Even if you bypass the edge nginx and connect directly to the container, slow attacks and large request bodies are restricted.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  52m;

    # Download the installation package (static file, do not use SPA route)
    location /download/ {
        alias /usr/share/nginx/html/download/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-1khQVHSpZN6ao7Mz5oQVOZp0DUbhfeh7gaACHa6hdtI=' 'sha256-t76ABT/rfuBYSFBlHZMfVt0fxrnGmo/wZr34YP0K0pE=' 'sha256-UBkYgPgiZBFG3L+ndNb3scO3EC/n1cO/CDvqsOiwHhI=' 'sha256-KKUq0K4BT5+WxogHlftH3nLleklV6aEEfxJ1UJ9xbww=' 'sha256-5z2p7XnhuW/GZAI9pkti4w/4gXI0uUWxIe8RBgHQjWE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://m.yzs88.com:8088 wss://m.yzs88.com:8088 wss://m.yzs88.com blob:" always;
    }

    # Hash-named static resources (JS/CSS): the file name changes with the content and can be strongly cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-1khQVHSpZN6ao7Mz5oQVOZp0DUbhfeh7gaACHa6hdtI=' 'sha256-t76ABT/rfuBYSFBlHZMfVt0fxrnGmo/wZr34YP0K0pE=' 'sha256-UBkYgPgiZBFG3L+ndNb3scO3EC/n1cO/CDvqsOiwHhI=' 'sha256-KKUq0K4BT5+WxogHlftH3nLleklV6aEEfxJ1UJ9xbww=' 'sha256-5z2p7XnhuW/GZAI9pkti4w/4gXI0uUWxIe8RBgHQjWE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://m.yzs88.com:8088 wss://m.yzs88.com:8088 wss://m.yzs88.com blob:" always;
        try_files $uri =404;
    }

    # Front-end SPA routing
    # Root directory files such as index.html and Service Worker are not cached (verified to the server each time).
    # Ensure that users can get the latest index.html referencing the new resource hash without manual swiping after the release.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-1khQVHSpZN6ao7Mz5oQVOZp0DUbhfeh7gaACHa6hdtI=' 'sha256-t76ABT/rfuBYSFBlHZMfVt0fxrnGmo/wZr34YP0K0pE=' 'sha256-UBkYgPgiZBFG3L+ndNb3scO3EC/n1cO/CDvqsOiwHhI=' 'sha256-KKUq0K4BT5+WxogHlftH3nLleklV6aEEfxJ1UJ9xbww=' 'sha256-5z2p7XnhuW/GZAI9pkti4w/4gXI0uUWxIe8RBgHQjWE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://m.yzs88.com:8088 wss://m.yzs88.com:8088 wss://m.yzs88.com blob:" always;
    }

    # Admin dashboard shell (served by the backend, not the SPA bundle).
    # Exact match on purpose: a prefix match would also capture unrelated paths
    # such as /administrator. The trailing-slash form is redirected rather than
    # proxied, because the backend registers the route as /admin only.
    location = /admin {
        proxy_pass         http://backend:8888;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_x_real_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /admin/ {
        return 301 /admin;
    }

    # API reverse proxy
    # X-Real-IP / X-Forwarded-For transparent transmission edge nginx written real client IP
    # (Do not overwrite it with $remote_addr, otherwise the backend will get the IP of edge nginx).
    location /api/ {
        access_log off;
        proxy_pass         http://backend:8888;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_x_real_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket reverse proxy
    location /ws {
        access_log off;
        proxy_pass         http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_x_real_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
