[package]
name = "yunmi"
version = "1.1.5"
description = "Yunmi — end-to-end encrypted chat"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Size matters here — the whole point of the Tauri shell is a small installer.
# These knobs trade compile time for roughly half the binary size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
