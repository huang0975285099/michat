name: e2eechat

# m.yzs88.com - self-contained production stack.
# Only the web and TURN ports are published on the host. MySQL and Redis stay
# on the private Compose network, so they do not conflict with existing host
# services (including the MySQL instance already bound to port 3306).
services:
  mysql:
    image: mysql:8.1.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: e2eechat
      MYSQL_USER: ${MYSQL_USER:-e2eechat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: e2eechat-backend:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG: /app/config.yaml
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MYSQL_DSN: ${MYSQL_USER:-e2eechat}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/e2eechat?charset=utf8mb4&parseTime=True&loc=Local
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      APP_LATEST_VERSION: "1.2.0"
      APP_MIN_VERSION: "1.0.0"
      APP_UPDATE_URL: "https://m.yzs88.com:8088"
      APP_WINDOWS_UPDATE_URL: "https://m.yzs88.com:8088/download/yunChat.exe"
      APP_APK_UPDATE_URL: "https://m.yzs88.com:8088/download/yunChat.apk"
      APP_VERSION_NOTES: ""
      ATTACHMENT_STORAGE_PATH: "/app/data/attachments"
    volumes:
      - ./deploy/config.yaml:/app/config.yaml:ro
      - attachment-data:/app/data/attachments
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/api/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: e2eechat-frontend:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./downloads:/usr/share/nginx/html/download:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  edge:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "8088:443"
    volumes:
      - ./nginx-vhost/m.yzs88.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/m.yzs88.com.pem:/etc/nginx/ssl/m.yzs88.com.pem:ro
      - ./ssl/m.yzs88.com.key:/etc/nginx/ssl/m.yzs88.com.key:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:4.17.2-r0-alpine
    restart: unless-stopped
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --realm=m.yzs88.com
      - --external-ip=112.18.238.6
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  mysql-data:
  redis-data:
  attachment-data:
